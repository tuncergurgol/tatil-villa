services:
  postgres:
    image: postgres:16-alpine
    container_name: tatil-villa-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tatil
      POSTGRES_PASSWORD: tatil_dev
      POSTGRES_DB: tatil_villa
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

# tatildeyiz-app — nginx (Cloudflare arkasında)
# /etc/nginx/sites-available/tatildeyiz -> sites-enabled symlink
# Cloudflare Origin Certificate ile SSL

# Cloudflare gerçek IP
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# Brute-force / abuse yavaşlatma
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream tatil_villa_app {
  server 127.0.0.1:3000;
  keepalive 64;
}

# HTTP -> HTTPS (tatildeyiz + admin)
server {
  listen 80;
  listen [::]:80;
  server_name bont.tatildeyiz.com.tr www.tatildeyiz.com.tr tatildeyiz.com.tr;
  return 301 https://$host$request_uri;
}

# HTTP -> HTTPS (balayi)
server {
  listen 80;
  listen [::]:80;
  server_name www.balayivillacisi.com balayivillacisi.com;
  return 301 https://$host$request_uri;
}

# HTTP -> HTTPS (tatilvillacisi)
server {
  listen 80;
  listen [::]:80;
  server_name www.tatilvillacisi.com tatilvillacisi.com;
  return 301 https://$host$request_uri;
}

# HTTPS — Admin panel (yalnızca bont)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name bont.tatildeyiz.com.tr;

  ssl_certificate     /etc/nginx/ssl/tatildeyiz.pem;
  ssl_certificate_key /etc/nginx/ssl/tatildeyiz.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 50M;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self)" always;

  # public/uploads — Next.js yeniden başlatılmadan yeni galeri dosyaları sunulur
  location /uploads/ {
    alias /var/www/tatil-villa/public/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location /api/auth {
    limit_req zone=login_limit burst=8 nodelay;
    proxy_pass http://tatil_villa_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://tatil_villa_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://tatil_villa_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

